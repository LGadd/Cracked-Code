[project]
name = "cracked-code"
version = "0.1.0"
description = "Cracked Code: a small, fast coding-agent harness built for Qwen3.8 on Strata (other OpenAI-compatible servers: best effort)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LGadd" }]
keywords = ["coding-agent", "llm", "qwen", "strata", "cli", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = ["prompt_toolkit>=3.0", "pygments>=2.0"]  # the prompt's live menu; code colours in answers. Both pure Python, work on Windows

[project.urls]
Homepage = "https://github.com/LGadd/cracked-code"
Issues = "https://github.com/LGadd/cracked-code/issues"
Changelog = "https://github.com/LGadd/cracked-code/blob/main/CHANGELOG.md"

[project.scripts]
cracked = "cracked_code.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cracked_code*"]
