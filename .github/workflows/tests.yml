name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: offline tests
        shell: bash
        run: |
          rc=0; python -m unittest discover -s tests -t . 2> test.log || rc=$?
          cat test.log
          # the failures as one annotation, so they show on the run page without opening the log
          if [ "$rc" -ne 0 ]; then
            grep -E -A15 "^(FAIL|ERROR):" test.log | head -200 | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace(chr(13), '').replace(chr(10), '%0A'); print('::error title=unittest failures::' + t)"
          fi
          exit "$rc"
